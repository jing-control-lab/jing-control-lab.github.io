<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title == 'Home' %}JCL · Jing Control Lab{% else %}{{ page.title | escape }} · JCL{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f3f6f4">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }} · JCL">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/group.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <nav aria-label="Main navigation">
        {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.nav == item.title %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
  <footer class="wrap footer"><span>© {{ 'now' | date: '%Y' }} JCL / Jing Control Lab</span></footer>
</body>
</html>
