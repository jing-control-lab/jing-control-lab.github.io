<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title != 'Home' %}{{ page.title | escape }} · {% endif %}JCL · Jing Control Lab</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#f3f6f4">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/group.css' | relative_url }}?v=single-page-1">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="wrap"><nav aria-label="On this page">
    {% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>{% endfor %}
  </nav></div></header>
  <main class="wrap" id="main" tabindex="-1">{{ content }}</main>
  <footer class="wrap"><p>© {{ 'now' | date: '%Y' }} JCL / Jing Control Lab</p></footer>
</body>
</html>
