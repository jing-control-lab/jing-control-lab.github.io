title: sicphd
name: sicphd
description: "Files, code, and projects. A small, growing collection of resources."
url: "https://sicphd.github.io"
baseurl: ""
repository: "sicphd/sicphd.github.io"
lang: en
timezone: Asia/Shanghai
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
include:
  - _pages
exclude:
  - README.md
  - instruction.md
  - files/README.md
  - LICENSE
  - NOTICE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - .openai
  - preview
  - scripts
plugins:
  - jekyll-sitemap
