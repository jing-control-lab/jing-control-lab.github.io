title: JCL
name: Jing Control Lab
description: "My personal space for code repositories and learning records on systems, agents, and control."
url: "https://jing-control-lab.github.io"
baseurl: ""
repository: "jing-control-lab/jing-control-lab.github.io"
lang: en
timezone: Asia/Shanghai
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
include:
  - _pages
exclude:
  - README.md
  - instruction.md
  - LICENSE
  - NOTICE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - .openai
  - preview
  - scripts
plugins:
  - jekyll-sitemap
