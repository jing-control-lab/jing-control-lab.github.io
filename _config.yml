title: JCL
name: Jing Control Lab
description: "Jing Control Lab — system identification, multi-agent systems, agent + control, and complex systems."
url: "https://jing-control-lab.github.io"
baseurl: ""
repository: "jing-control-lab/jing-control-lab.github.io"
lang: en
timezone: Asia/Shanghai
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
include:
  - _pages
exclude:
  - README.md
  - instruction.md
  - LICENSE
  - NOTICE.md
  - Gemfile
  - Gemfile.lock
  - _blogs/README.md
  - _blogs/template.md
  - vendor
  - node_modules
  - .bundle
  - .openai
  - preview
  - scripts
collections:
  blogs:
    output: true
    permalink: /blogs/:name/
defaults:
  - scope:
      path: ""
      type: blogs
    values:
      layout: post
      nav: Blog
      lang: en
plugins:
  - jekyll-sitemap
